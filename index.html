<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0f1a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<title>贪吃蛇 · 手机版</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: radial-gradient(circle at 50% 20%, #16213e 0%, #0a0f1a 70%);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #e2e8f0;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    overscroll-behavior: none;
    overflow: hidden;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 10px;
    gap: 8px;
  }
  h1 {
    font-size: 24px;
    color: #4ade80;
    letter-spacing: 6px;
    margin: 0;
    text-shadow: 0 0 12px rgba(74,222,128,.45);
  }
  .score-bar {
    display: flex;
    gap: 20px;
    font-size: 14px;
    color: #94a3b8;
  }
  .score-bar b { color: #4ade80; font-size: 18px; }
  canvas {
    background: #0b1220;
    border: 2px solid #26334d;
    border-radius: 14px;
    box-shadow: 0 10px 40px rgba(0,0,0,.65), inset 0 0 30px rgba(0,0,0,.4);
    display: block;
    touch-action: none;
  }
  /* 方向键面板 */
  .dpad {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
  }
  .dpad-row { display: flex; gap: 6px; }
  .dbtn {
    width: 62px;
    height: 52px;
    font-size: 24px;
    color: #cbd5e1;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform .05s, background .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .dbtn:active { transform: scale(.92); background: rgba(74,222,128,.2); }
  .dbtn.blank { visibility: hidden; }
  .bottom-btns {
    display: flex;
    gap: 10px;
    margin-top: 4px;
  }
  .bottom-btns button {
    background: #4ade80;
    color: #0a0f1a;
    border: none;
    padding: 9px 20px;
    font-size: 15px;
    font-weight: bold;
    border-radius: 9px;
    cursor: pointer;
  }
  .bottom-btns button.ghost {
    background: rgba(255,255,255,.08);
    color: #e2e8f0;
    border: 1px solid rgba(255,255,255,.2);
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🐍 贪吃蛇</h1>
  <div class="score-bar">
    <span>得分 <b id="score">0</b></span>
    <span>最高 <b id="best">0</b></span>
  </div>

  <canvas id="cv"></canvas>

  <!-- 虚拟方向键 -->
  <div class="dpad">
    <div class="dpad-row">
      <div class="dbtn blank"></div>
      <div class="dbtn" data-dir="up">▲</div>
      <div class="dbtn blank"></div>
    </div>
    <div class="dpad-row">
      <div class="dbtn" data-dir="left">◀</div>
      <div class="dbtn" data-dir="down">▼</div>
      <div class="dbtn" data-dir="right">▶</div>
    </div>
  </div>

  <div class="bottom-btns">
    <button id="btnStart">开始/暂停</button>
    <button id="btnRestart" class="ghost">重来</button>
  </div>
</div>

<script>
(function(){
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const btnStart = document.getElementById('btnStart');
  const btnRestart = document.getElementById('btnRestart');

  // 自适应尺寸
  const size = Math.min(window.innerWidth - 20, window.innerHeight * 0.42, 380);
  const GRID = Math.floor(size / 20);
  const COLS = 20, ROWS = 20;
  cv.width = COLS * GRID; cv.height = ROWS * GRID;

  let snake, dir, nextDir, food, score, best, running, gameOver, timer;

  best = Number(localStorage.getItem('snake-best-phone') || 0);
  bestEl.textContent = best;

  const SPEED = 150;

  function reset(){
    snake = [{x:8,y:10},{x:7,y:10},{x:6,y:10},{x:5,y:10}];
    dir = {x:1,y:0}; nextDir = {x:1,y:0};
    score = 0; running = false; gameOver = false;
    scoreEl.textContent = 0;
    placeFood(); draw();
  }

  function placeFood(){
    do {
      food = { x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS) };
    } while (snake.some(s => s.x===food.x && s.y===food.y));
  }

  // 圆角矩形
  function rr(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);

    // 网格（淡）
    ctx.strokeStyle = 'rgba(255,255,255,.03)';
    for(let i=0;i<=COLS;i++){
      ctx.beginPath(); ctx.moveTo(i*GRID,0); ctx.lineTo(i*GRID,cv.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,i*GRID); ctx.lineTo(cv.width,i*GRID); ctx.stroke();
    }

    // 食物：发光红苹果
    ctx.save();
    ctx.shadowColor = '#f87171'; ctx.shadowBlur = 16;
    ctx.fillStyle = '#f87171';
    ctx.beginPath();
    ctx.arc(food.x*GRID+GRID/2, food.y*GRID+GRID/2, GRID*0.37, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
    // 高光
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.beginPath();
    ctx.arc(food.x*GRID+GRID/2 - GRID*0.1, food.y*GRID+GRID/2 - GRID*0.1, GRID*0.1, 0, Math.PI*2);
    ctx.fill();

    // 蛇身：圆润渐变
    for(let i=snake.length-1; i>=0; i--){
      const seg = snake[i];
      const t = i / Math.max(snake.length-1, 1);
      // 头部亮绿 -> 尾部深绿
      const g = Math.round(200 - t*130);
      const r = Math.round(30 - t*10);
      const pad = 2;
      ctx.fillStyle = `rgb(${r},${g},80)`;
      ctx.shadowColor = i===0 ? 'rgba(74,222,128,.6)' : 'transparent';
      ctx.shadowBlur = i===0 ? 12 : 0;
      rr(seg.x*GRID+pad, seg.y*GRID+pad, GRID-pad*2, GRID-pad*2, GRID*0.3);
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    // 蛇头眼睛
    if(snake.length){
      const h = snake[0];
      const cx=h.x*GRID+GRID/2, cy=h.y*GRID+GRID/2;
      const fx=dir.x, fy=dir.y, px=-dir.y, py=dir.x;
      ctx.fillStyle='#fff';
      const e1x=cx+fx*GRID*0.22+px*GRID*0.18, e1y=cy+fy*GRID*0.22+py*GRID*0.18;
      const e2x=cx+fx*GRID*0.22-px*GRID*0.18, e2y=cy+fy*GRID*0.22-py*GRID*0.18;
      ctx.beginPath(); ctx.arc(e1x,e1y,GRID*0.12,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(e2x,e2y,GRID*0.12,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#0b1220';
      ctx.beginPath(); ctx.arc(e1x+fx*GRID*0.05,e1y+fy*GRID*0.05,GRID*0.06,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(e2x+fx*GRID*0.05,e2y+fy*GRID*0.05,GRID*0.06,0,Math.PI*2); ctx.fill();
    }

    if(gameOver){
      ctx.fillStyle='rgba(0,0,0,.72)'; ctx.fillRect(0,0,cv.width,cv.height);
      ctx.fillStyle='#f87171'; ctx.font='bold '+Math.floor(GRID*1.5)+'px sans-serif';
      ctx.textAlign='center';
      ctx.fillText('游戏结束', cv.width/2, cv.height/2-8);
      ctx.fillStyle='#e2e8f0'; ctx.font=Math.floor(GRID*0.78)+'px sans-serif';
      ctx.fillText('点「开始」再来一局', cv.width/2, cv.height/2+22);
    }
  }

  function tick(){
    if(!running || gameOver) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS) return end();
    if(snake.some(s=>s.x===head.x && s.y===head.y)) return end();
    snake.unshift(head);
    if(head.x===food.x && head.y===food.y){
      score += 10; scoreEl.textContent = score; placeFood();
    } else snake.pop();
    draw();
  }
  function end(){
    gameOver = true; running = false; clearInterval(timer);
    if(score > best){ best = score; localStorage.setItem('snake-best-phone', best); bestEl.textContent = best; }
    draw();
  }
  function toggle(){
    if(gameOver) reset();
    if(running){ running=false; clearInterval(timer); }
    else { running=true; timer=setInterval(tick, SPEED); }
  }
  function changeDir(x,y){
    if(x === -dir.x && y === -dir.y) return;
    nextDir = {x,y};
  }

  // 键盘
  window.addEventListener('keydown', e=>{
    const k = e.key.toLowerCase();
    if(k===' '){ e.preventDefault(); toggle(); return; }
    if(k==='p'){ reset(); return; }
    if(['arrowup','w'].includes(k)) changeDir(0,-1);
    else if(['arrowdown','s'].includes(k)) changeDir(0,1);
    else if(['arrowleft','a'].includes(k)) changeDir(-1,0);
    else if(['arrowright','d'].includes(k)) changeDir(1,0);
  });

  // 虚拟方向键
  document.querySelectorAll('.dbtn[data-dir]').forEach(btn=>{
    const dirMap = { up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0} };
    btn.addEventListener('touchstart', e=>{
      e.preventDefault();
      changeDir(dirMap[btn.dataset.dir].x, dirMap[btn.dataset.dir].y);
    }, {passive:false});
    btn.addEventListener('mousedown', e=>{
      changeDir(dirMap[btn.dataset.dir].x, dirMap[btn.dataset.dir].y);
    });
  });

  // 保留滑动控制（在 canvas 区域）
  let sx=0, sy=0;
  cv.addEventListener('touchstart', e=>{
    const t=e.touches[0]; sx=t.clientX; sy=t.clientY;
    e.preventDefault();
  }, {passive:false});
  cv.addEventListener('touchmove', e=>{
    e.preventDefault();
    const t=e.touches[0];
    const dx=t.clientX-sx, dy=t.clientY-sy;
    if(Math.abs(dx)<12 && Math.abs(dy)<12) return;
    if(Math.abs(dx)>Math.abs(dy)) changeDir(dx>0?1:-1, 0);
    else changeDir(0, dy>0?1:-1);
    sx=t.clientX; sy=t.clientY;
  }, {passive:false});

  btnStart.addEventListener('click', toggle);
  btnRestart.addEventListener('click', reset);

  reset();
})();
</script>
</body>
</html>
